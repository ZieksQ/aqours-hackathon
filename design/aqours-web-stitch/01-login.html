<!-- Shell Visibility Filter: Navigation Shell suppressed for linear/auth destination (Login screen) -->
<body class="bg-background text-on-surface min-h-screen flex flex-col justify-between selection:bg-secondary-container selection:text-on-secondary-fixed">
<!-- Operational Utility Top Header Strip -->
<header class="w-full h-[56px] bg-surface border-b border-surface-variant px-space-xl flex items-center justify-between z-10 shrink-0"><div class="flex items-center gap-space-sm"><div class="w-7 h-7 flex items-center justify-center text-secondary"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M12 2.7C12 2.7 5.5 10.4 5.5 15.2C5.5 18.8 8.4 21.7 12 21.7C15.6 21.7 18.5 18.8 18.5 15.2C18.5 10.4 12 2.7 12 2.7Z"></path><path d="M14.5 12.8C14.1 11.2 13.1 9.8 12 8.6" stroke="#12677b" stroke-linecap="round" stroke-width="1.5"></path></svg></div><div class="flex items-center gap-space-xs"><span class="text-label-default font-label-default text-primary tracking-tight font-semibold">Aqours</span><span class="text-metadata font-metadata text-on-surface-variant">· Supplier portal</span></div></div></header>
<!-- Central Work Canvas / Framed Sheet Context -->
<main class="flex-1 flex items-center justify-center p-space-base md:p-margin-panel">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-surface-variant rounded-lg p-space-xl md:p-space-2xl">
<!-- Brand Anchor Header -->
<div class="text-center mb-space-xl">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container border border-surface-variant mb-space-base text-secondary">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewbox="0 0 24 24">
<path d="M12 2.5C12 2.5 5 10.5 5 15.5C5 19.366 8.134 22.5 12 22.5C15.866 22.5 19 19.366 19 15.5C19 10.5 12 2.5 12 2.5Z"></path>
<path d="M14.8 13.5C14.2 11.8 13.2 10.2 12 8.8" stroke="#12677b" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</div>
<h1 class="text-headline-section font-headline-section text-primary tracking-tight">
          Aqours Supplier Portal
        </h1>
<p class="text-body-default font-body-default text-on-surface-variant mt-space-2xs">Water reporting and response</p>
</div>
<!-- Authentication Form Panel -->
<div class="space-y-space-lg">
<div>
<h2 class="text-subhead font-subhead text-primary">Sign in</h2>
<p class="text-metadata font-metadata text-on-surface-variant mt-space-2xs">Enter your authorized credentials to access municipal consoles.</p>
</div>
<form class="space-y-space-base" id="loginForm" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="space-y-space-xs">
<label class="block text-label-default font-label-default text-primary" for="email">
              Email address
            </label>
<div class="relative">
<input autocomplete="email" class="w-full h-[36px] bg-surface-container-lowest border border-surface-variant rounded text-on-surface text-body-default font-body-default px-space-md placeholder:text-on-primary-container focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors duration-150" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input with Show/Hide Toggle -->
<div class="space-y-space-xs">
<div class="flex items-center justify-between">
<label class="block text-label-default font-label-default text-primary" for="password">
                Password
              </label>
</div>
<div class="relative">
<input autocomplete="current-password" class="w-full h-[36px] bg-surface-container-lowest border border-surface-variant rounded text-on-surface text-body-default font-body-default px-space-md pr-10 placeholder:text-on-primary-container focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors duration-150" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-[36px] w-9 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer select-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Action Button: Near-black #1D1F20 -->
<div class="pt-space-xs">
<button class="w-full h-[36px] bg-primary-container hover:bg-tertiary-container active:bg-primary text-on-primary rounded text-label-default font-label-default transition-colors duration-150 flex items-center justify-center gap-space-xs shadow-none border border-transparent cursor-pointer" type="submit">
              Sign in
            </button>
</div>
</form>
<!-- Informational Notes Section -->
<div class="pt-space-base border-t border-surface-variant space-y-space-xs"><p class="text-metadata font-metadata text-on-surface-variant text-center">Water reporting, response and monitoring</p></div>
</div>
</div>
</main>
<!-- Technical Utility Footer -->
<footer class="w-full py-space-base px-space-xl border-t border-surface-variant text-center bg-surface shrink-0"><div class="flex flex-col sm:flex-row items-center justify-between max-w-5xl mx-auto gap-space-xs text-metadata font-metadata text-on-surface-variant"><span>Aqours · Supplier portal</span><span>Water reporting, response and monitoring</span></div></footer>
<!-- Functional Micro-Interaction: Password Visibility Toggle -->
<script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const passwordIcon = document.getElementById('passwordIcon');

    if (toggleButton && passwordInput && passwordIcon) {
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          passwordIcon.textContent = 'visibility_off';
          toggleButton.setAttribute('aria-label', 'Hide password');
        } else {
          passwordInput.setAttribute('type', 'password');
          passwordIcon.textContent = 'visibility';
          toggleButton.setAttribute('aria-label', 'Show password');
        }
      });
    }
  </script>
