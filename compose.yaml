name: aqours-hackathon

services:
  db:
    image: postgres:18.6-alpine3.23
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqours}
      POSTGRES_USER: ${POSTGRES_USER:-aqours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  database:
