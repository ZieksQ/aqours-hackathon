name: aqours-hackathon

services:
  db:
    image: postgres:18.6-alpine3.23
    pull_policy: missing
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aqours}
      POSTGRES_USER: ${POSTGRES_USER:-aqours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file or shell environment}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5251
      ConnectionStrings__Aqours: ${DOCKER_API_CONNECTION_STRING:-}
      Jwt__Issuer: ${JWT_ISSUER:-Aqours.Local}
      Jwt__Audience: ${JWT_AUDIENCE:-Aqours.WebAndMobile}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__FirstName: ${SEED_ADMIN_FIRST_NAME:-}
      SeedAdmin__MiddleName: ${SEED_ADMIN_MIDDLE_NAME:-}
      SeedAdmin__LastName: ${SEED_ADMIN_LAST_NAME:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH: "1"
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:5251:5251"
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./packages/psgc/data:/workspace/packages/psgc/data:ro
      - /workspace/apps/api/src/Aqours.Api/bin
      - /workspace/apps/api/src/Aqours.Api/obj
      - /workspace/apps/api/src/Aqours.Application/bin
      - /workspace/apps/api/src/Aqours.Application/obj
      - /workspace/apps/api/src/Aqours.Domain/bin
      - /workspace/apps/api/src/Aqours.Domain/obj
      - /workspace/apps/api/src/Aqours.Infrastructure/bin
      - /workspace/apps/api/src/Aqours.Infrastructure/obj
      - nuget-cache:/home/aqours/.nuget/packages
      - api-data-protection:/home/aqours/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    image: aqours-hackathon-javascript:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/javascript/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    command: ["pnpm", "--filter", "@aqours/web", "exec", "vite", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://api:5251
      VITE_GEOAPIFY_API_KEY: ${VITE_GEOAPIFY_API_KEY:-}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json
      - ./apps/web/tsconfig.app.json:/workspace/apps/web/tsconfig.app.json
      - ./apps/web/tsconfig.node.json:/workspace/apps/web/tsconfig.node.json
      - ./apps/web/public:/workspace/apps/web/public
      - ./packages/ui/src:/workspace/packages/ui/src
      - ./packages/psgc/data:/workspace/packages/psgc/data:ro
    depends_on:
      api:
        condition: service_healthy

  mobile:
    profiles: ["mobile"]
    image: aqours-hackathon-javascript:dev
    pull_policy: build
    build:
      context: .
      dockerfile: docker/javascript/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    entrypoint: ["/usr/local/bin/mobile-entrypoint"]
    command: ["pnpm", "--filter", "@aqours/mobile", "exec", "expo", "start", "--go", "--lan", "--port", "8081"]
    stdin_open: true
    tty: true
    environment:
      LAN_IP: ${LAN_IP:-}
      API_BIND_ADDRESS: ${API_BIND_ADDRESS:-127.0.0.1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${LAN_IP:-}
      EXPO_PACKAGER_PROXY_URL: http://${LAN_IP:-}:8081
      EXPO_PUBLIC_API_URL: http://${LAN_IP:-}:5251
      EXPO_PUBLIC_GEOAPIFY_API_KEY: ${EXPO_PUBLIC_GEOAPIFY_API_KEY:-}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${EXPO_PUBLIC_EAS_PROJECT_ID:-}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8081:8081"
    volumes:
      - ./apps/mobile/App.tsx:/workspace/apps/mobile/App.tsx
      - ./apps/mobile/index.ts:/workspace/apps/mobile/index.ts
      - ./apps/mobile/app.json:/workspace/apps/mobile/app.json
      - ./apps/mobile/tsconfig.json:/workspace/apps/mobile/tsconfig.json
      - ./apps/mobile/src:/workspace/apps/mobile/src
      - ./apps/mobile/assets:/workspace/apps/mobile/assets:ro
      - ./packages/psgc/data:/workspace/packages/psgc/data:ro
      - /workspace/apps/mobile/.expo
    depends_on:
      api:
        condition: service_healthy

volumes:
  database:
  nuget-cache:
  api-data-protection:
