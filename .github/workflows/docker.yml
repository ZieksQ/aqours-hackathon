name: Docker build and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases. Superseded pull requests and non-main manual runs cancel.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Tests and lint
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.image }}
    needs: checks
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api/Dockerfile
            target: production
          - image: migration
            dockerfile: docker/api/Dockerfile
            target: migration
          - image: web
            dockerfile: docker/javascript/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          # GHA exports layers, not the API Dockerfile's NuGet cache mount.
          no-cache-filters: ${{ matrix.image != 'web' && 'restore' || '' }}
          build-args: ${{ matrix.image == 'web' && format('VITE_GEOAPIFY_API_KEY={0}', vars.VITE_GEOAPIFY_API_KEY) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    name: Publish ${{ matrix.image }}
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api/Dockerfile
            target: production
          - image: migration
            dockerfile: docker/api/Dockerfile
            target: migration
          - image: web
            dockerfile: docker/javascript/Dockerfile
            target: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Determine lowercase image name
        id: image
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          # Repopulate NuGet before --no-restore publish on a fresh runner.
          no-cache-filters: ${{ matrix.image != 'web' && 'restore' || '' }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.image == 'web' && format('VITE_GEOAPIFY_API_KEY={0}', vars.VITE_GEOAPIFY_API_KEY) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  latest:
    name: Promote latest images
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check that this commit is still the main tip
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping latest promotion: main has advanced past this commit." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.current.outputs.promote == 'true'
      - name: Log in to GHCR
        if: steps.current.outputs.promote == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote all successful commit images
        if: steps.current.outputs.promote == 'true'
        run: |
          for image in api migration web; do
            name="ghcr.io/${GITHUB_REPOSITORY,,}-${image}"
            docker buildx imagetools create --tag "${name}:latest" "${name}:${GITHUB_SHA}"
            echo "Published ${name}:${GITHUB_SHA} and ${name}:latest" >> "$GITHUB_STEP_SUMMARY"
          done
