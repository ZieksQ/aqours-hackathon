name: aqours-production

services:
  db:
    image: postgres:18.6-alpine3.23
    pull_policy: missing
    user: postgres
    environment:
      POSTGRES_DB: ${PROD_POSTGRES_DB:-aqours}
      POSTGRES_USER: ${PROD_POSTGRES_USER:-aqours_bootstrap}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?Set PROD_POSTGRES_PASSWORD in the production environment file}
    volumes:
      - production-database:/var/lib/postgresql
    networks:
      - database
    restart: unless-stopped
    stop_grace_period: 1m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=3777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging: &production-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${PROD_API_IMAGE:-aqours-production-api:local}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Aqours: ${PROD_API_CONNECTION_STRING:-}
      ChatAttachments__RootPath: /app/storage/chat-attachments
      Jwt__Issuer: ${PROD_JWT_ISSUER:-}
      Jwt__Audience: ${PROD_JWT_AUDIENCE:-}
      Jwt__SigningKey: ${PROD_JWT_SIGNING_KEY:-}
      SeedAdmin__Email: ${PROD_SEED_ADMIN_EMAIL:-}
      SeedAdmin__FirstName: ${PROD_SEED_ADMIN_FIRST_NAME:-}
      SeedAdmin__MiddleName: ${PROD_SEED_ADMIN_MIDDLE_NAME:-}
      SeedAdmin__LastName: ${PROD_SEED_ADMIN_LAST_NAME:-}
      SeedAdmin__Password: ${PROD_SEED_ADMIN_PASSWORD:-}
      PROD_PUBLIC_HOST: ${PROD_PUBLIC_HOST:-}
      PROD_PROXY_CIDR: ${PROD_PROXY_CIDR:-172.30.0.0/24}
      AQOURS_DATA_PROTECTION_KEY_PATH: /var/lib/aqours/data-protection
      API_HEALTH_HOST: ${PROD_PUBLIC_HOST:-}
    volumes:
      - production-data-protection:/var/lib/aqours/data-protection
      - production-chat-attachments:/app/storage/chat-attachments
    networks:
      - proxy
      - database
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging: *production-logging
    healthcheck:
      test: ["CMD", "dotnet", "Aqours.Api.dll", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    image: ${PROD_WEB_IMAGE:-aqours-production-web:local}
    build:
      context: .
      dockerfile: docker/javascript/Dockerfile
      target: production
      args:
        VITE_GEOAPIFY_API_KEY: ${PROD_VITE_GEOAPIFY_API_KEY:-}
    environment:
      PROD_PUBLIC_HOST: ${PROD_PUBLIC_HOST:-}
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:-8080}:8080"
    networks:
      - proxy
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging: *production-logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/web-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    profiles: ["migration"]
    image: ${PROD_MIGRATION_IMAGE:-aqours-production-migration:local}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: migration
    environment:
      ConnectionStrings__Aqours: ${PROD_MIGRATION_CONNECTION_STRING:-}
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/aqours-bundles
    networks:
      - database
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m,exec
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging: *production-logging

networks:
  proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${PROD_PROXY_CIDR:-172.30.0.0/24}
  database:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${PROD_DATABASE_CIDR:-172.31.0.0/24}

volumes:
  production-database:
  production-data-protection:
  production-chat-attachments:
